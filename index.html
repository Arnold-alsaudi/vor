<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<title>المتصدرون - Top Likes</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Lilita+One&display=swap">
<style>
  :root{--c:#8b5cf6}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;background:transparent;overflow:hidden}
  #stage{position:absolute;left:0;top:0;width:620px;height:600px;transform-origin:0 0;direction:ltr}

  /* ← الـ CSS بتاعك هنا */
  #fx{position:absolute;left:0;top:0;width:620px;height:600px;pointer-events:none;z-index:1}
  #board{position:absolute;left:0;top:0;width:620px;height:600px;z-index:2}

  #title{
    position:absolute;left:0;top:2px;width:600px;margin-left:10px;text-align:center;
    font-family:'Lalezar',sans-serif;font-size:30px;letter-spacing:1px;color:#fff;
    text-shadow:0 0 14px var(--c),0 2px 4px rgba(0,0,0,.8);opacity:0;display:none;
  }
  #title.on{display:block;animation:tin .7s ease both}
  @keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}

  .card{
    position:absolute;left:10px;top:0;width:600px;height:92px;
    transform:translate(64px,0);opacity:0;will-change:transform,opacity;
    transition:transform .62s cubic-bezier(.2,.85,.25,1),opacity .5s ease;
  }
  /* لوحة الألوان لكل مركز */
  .card[data-rank="1"]{--rc:#ffd633;--txt:#241a00;--g1:#ff9d00;--g2:#ffe27a}
  .card[data-rank="2"]{--rc:#e7ecf3;--txt:#181b20;--g1:#7f8792;--g2:#eef2f8}
  .card[data-rank="3"]{--rc:#ff5147;--txt:#ffffff;--g1:#b01414;--g2:#ff5b52}
  .card[data-rank="4"]{--rc:#39b7ff;--txt:#ffffff;--g1:#0b3ea1;--g2:#49a9f5}
  .card[data-rank="5"]{--rc:#9dff45;--txt:#0f2409;--g1:#2ea22e;--g2:#bcff63}

  .bar{
    position:absolute;left:0;top:16px;width:432px;height:60px;border-radius:13px;
    background:linear-gradient(95deg,var(--g1),var(--g2));
    box-shadow:0 0 20px -2px var(--rc),0 6px 16px rgba(0,0,0,.45),
               inset 0 1px 0 rgba(255,255,255,.35),inset 0 -2px 6px rgba(0,0,0,.25);
    overflow:hidden;
  }
  .bar::after{ /* لمعان يمر عند التحديث */
    content:"";position:absolute;top:0;bottom:0;left:-40%;width:35%;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);
    transform:skewX(-18deg);opacity:0;
  }
  .card.hit .bar::after{animation:shine .7s ease}
  @keyframes shine{0%{left:-40%;opacity:.9}100%{left:120%;opacity:0}}

  .stat{position:absolute;left:14px;top:0;height:60px;display:flex;align-items:center;gap:7px}
  .stat svg{width:26px;height:26px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4));flex:0 0 auto}
  .cnt{font-family:'Lilita One',cursive;font-size:29px;line-height:1;color:var(--txt);
       text-shadow:0 1px 1px rgba(0,0,0,.25);letter-spacing:.5px}

  .nm{position:absolute;top:0;left:120px;right:82px;height:60px;display:flex;align-items:center;
      justify-content:flex-end;overflow:hidden}
  .nm span{font-family:'Lalezar',sans-serif;font-size:27px;line-height:1.05;color:var(--txt);
      white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,.28);transform-origin:right center}

  .ava{position:absolute;left:378px;top:2px;width:88px;height:88px;border-radius:50%;
       background:#111;border:3px solid var(--rc);overflow:hidden;
       box-shadow:0 0 18px var(--rc),0 0 40px -6px var(--rc),0 3px 10px rgba(0,0,0,.5);
       animation:apulse 2.6s ease-in-out infinite}
  @keyframes apulse{0%,100%{box-shadow:0 0 16px var(--rc),0 0 36px -8px var(--rc),0 3px 10px rgba(0,0,0,.5)}
                    50%{box-shadow:0 0 26px var(--rc),0 0 60px -6px var(--rc),0 3px 10px rgba(0,0,0,.5)}}
  .ava img{width:100%;height:100%;object-fit:cover;display:block}
  .ava .ini{width:100%;height:100%;display:flex;align-items:center;justify-content:center;
       font-family:'Lilita One',cursive;font-size:40px;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.5)}

  .rank{position:absolute;left:498px;top:0;width:102px;height:92px;display:flex;
        align-items:center;justify-content:center;font-family:'Lilita One',cursive;
        font-size:58px;color:var(--rc);
        text-shadow:0 0 12px var(--rc),0 0 28px var(--rc),0 3px 4px rgba(0,0,0,.6);
        -webkit-text-stroke:1px rgba(0,0,0,.25)}
</style></head>
<body>
<div id="stage">
  <!-- ← عناصر التركيبة هنا -->
  <canvas id="fx" width="620" height="600"></canvas>
  <div id="title"></div>
  <div id="board"></div>
</div>
<script>
(function () {
  "use strict";
  var CFG = window.__T || {}, q = new URLSearchParams(location.search);
  function P(k, d) { return CFG[k] != null ? String(CFG[k]) : (q.has(k) ? q.get(k) : d); }
  var $ = function (id) { return document.getElementById(id); };

  var col = P("color", "");
  if (/^#[0-9a-f]{6}$/i.test(col)) document.documentElement.style.setProperty("--c", col);

  var W = 1000, H = 300, stage = $("stage");   // ← نفس مقاس #stage
  W = 620; H = 600;
  function fit() {
    var s = Math.min(innerWidth / W, innerHeight / H);
    stage.style.transform = "translate(" + (innerWidth - W * s) / 2 + "px," + (innerHeight - H * s) / 2 + "px) scale(" + s + ")";
  }
  addEventListener("resize", fit); fit();

  // ← بيتنادى مع كل رسالة من السيرفر (أو من وضع المعاينة). اكتب هنا اللي بيحصل.
  function onEvent(m) {
    var A = stage.__app || (stage.__app = createApp());
    A.handle(m);

    // ============ منطق التركيبة (يُنشأ مرّة واحدة) ============
    function createApp() {
      var board = $("board"), cv = $("fx"), ctx = cv.getContext("2d");

      // إعدادات
      var METRIC = (P("metric", "likes") === "coins") ? "coins" : "likes";
      var MAX = Math.max(3, Math.min(5, parseInt(P("max", "5"), 10) || 5));
      var DEMO = P("demo") === "1";
      var titleTxt = P("title", "");
      if (titleTxt) { var t = $("title"); t.textContent = titleTxt; t.className = "on"; }
      var TOP_PAD = titleTxt ? 40 : 26;
      var STRIDE = 108, AVA_CX = 424, AVA_CY_OFF = 46;

      var RC = ["#ffd633", "#e7ecf3", "#ff5147", "#39b7ff", "#9dff45"];
      var HEART = '<svg viewBox="0 0 24 24"><path fill="#ff2d55" d="M12 21s-7.5-4.8-10-9.3C.3 8.4 2 4.7 5.5 4.7c2 0 3.4 1.1 4.5 2.6 1.1-1.5 2.5-2.6 4.5-2.6C18 4.7 19.7 8.4 22 11.7 19.5 16.2 12 21 12 21z"/></svg>';
      var COIN = '<svg viewBox="0 0 24 24"><path fill="#4fd1ff" d="M12 2l3 5.2 5.8.6-4.3 3.9 1.2 5.7L12 20.4 6.3 23l1.2-5.7L3.2 13.4 9 12.8z" transform="translate(0 -0.5)"/><circle cx="12" cy="12" r="10" fill="none" stroke="#bff0ff" stroke-width="0" /></svg>';
      var ICON = METRIC === "coins" ? COIN : HEART;

      // حالة المستخدمين
      var users = {};          // id -> {id,name,handle,avatar,likes,coins}
      var cards = {};          // id -> عنصر بطاقة
      var emitters = {};       // id -> {x, y, ty, color, smoke}
      var dirty = false, lastHit = 0;

      function val(u) { return METRIC === "coins" ? u.coins : u.likes; }

      function fmt(n) {
        n = Math.round(n);
        if (n >= 1e6) return (n / 1e6).toFixed(1) + "M";
        if (n >= 1e3) return (n / 1e3).toFixed(1) + "K";
        return "" + n;
      }
      function firstChar(s) { s = (s || "").trim(); return s ? Array.from(s)[0] : "?"; }
      function hue(id) { var h = 0, i; id = "" + id; for (i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) % 360; return h; }

      function upsert(user, field, amount) {
        if (!user || user.id == null) return null;
        var id = "" + user.id, u = users[id];
        if (!u) u = users[id] = { id: id, likes: 0, coins: 0 };
        if (user.name != null) u.name = user.name;
        if (user.handle != null) u.handle = user.handle;
        if (user.avatar != null) u.avatar = user.avatar;
        u[field] += (amount > 0 ? amount : 0);
        return u;
      }

      function handle(m) {
        if (!m || !m.type) return;
        if (m.type === "like") upsert(m.user, "likes", +m.count || 0);
        else if (m.type === "gift") upsert(m.user, "coins", +m.diamonds || 0);
        else if (m.type === "top" && m.user) upsert(m.user, "coins", 0); // يظهر صاحب أعلى هدية لو المقياس كوينز
        else return;
        dirty = true;
      }

      function fitName(sp) {
        var box = sp.parentNode, avail = box.clientWidth - 2, size = 27;
        sp.style.fontSize = size + "px";
        while (sp.scrollWidth > avail && size > 12) { size -= 1; sp.style.fontSize = size + "px"; }
        // تصغير إضافي بسيط لو باقي طويل (بدون قص)
        if (sp.scrollWidth > avail) sp.style.transform = "scaleX(" + Math.max(0.72, avail / sp.scrollWidth) + ")";
        else sp.style.transform = "";
      }

      function setAvatar(el, u) {
        var box = el._ava;
        var useImg = !DEMO && u.avatar && /^https?:\/\/[^\/]*tiktokcdn\.com\//i.test(u.avatar);
        if (useImg) {
          if (el._imgSrc === u.avatar) return;
          el._imgSrc = u.avatar;
          box.innerHTML = "";
          var img = document.createElement("img");
          img.onerror = function () { el._imgSrc = null; showIni(); };
          img.src = u.avatar; box.appendChild(img);
        } else { el._imgSrc = null; showIni(); }
        function showIni() {
          box.innerHTML = "";
          var d = document.createElement("div");
          d.className = "ini"; d.textContent = firstChar(u.name || u.handle || "?");
          var rc = (getComputedStyle(el).getPropertyValue("--rc") || "").trim() || "hsl(" + hue(u.id) + ",65%,45%)";
          d.style.background = "radial-gradient(circle at 35% 30%," + rc + ",rgba(0,0,0,.55))";
          box.appendChild(d);
        }
      }

      function makeCard(u) {
        var c = document.createElement("div");
        c.className = "card";
        c.innerHTML =
          '<div class="bar">' +
            '<div class="stat">' + ICON + '<span class="cnt">0</span></div>' +
            '<div class="nm"><span></span></div>' +
          '</div>' +
          '<div class="ava"></div>' +
          '<div class="rank"></div>';
        c._cnt = c.querySelector(".cnt");
        c._nm = c.querySelector(".nm span");
        c._ava = c.querySelector(".ava");
        c._rank = c.querySelector(".rank");
        c._val = 0; c._target = 0; c._name = "";
        board.appendChild(c);
        return c;
      }

      function layout() {
        var list = [], id;
        for (id in users) if (val(users[id]) > 0) list.push(users[id]);
        list.sort(function (a, b) { return val(b) - val(a) || (a.id < b.id ? -1 : 1); });
        list = list.slice(0, MAX);

        var present = {};
        list.forEach(function (u, i) {
          present[u.id] = 1;
          var rk = i + 1, y = TOP_PAD + i * STRIDE;
          var c = cards[u.id];
          if (!c) {
            c = cards[u.id] = makeCard(u);
            c.setAttribute("data-rank", rk);
            c.style.transform = "translate(64px," + y + "px)";
            c._val = val(u);            // البطاقة الجديدة تبدأ بقيمتها
            c._cnt.textContent = fmt(c._val);
            requestAnimationFrame(function () {
              requestAnimationFrame(function () {
                c.style.opacity = "1";
                c.style.transform = "translate(0," + y + "px)";
              });
            });
          } else {
            c.setAttribute("data-rank", rk);
            c.style.opacity = "1";
            c.style.transform = "translate(0," + y + "px)";
          }
          // الاسم
          if (c._name !== (u.name || u.handle || "")) {
            c._name = u.name || u.handle || "";
            c._nm.textContent = c._name;
            fitName(c._nm);
          }
          c._rank.textContent = rk;
          setAvatar(c, u);
          // تحديث القيمة + وميض لطيف عند الزيادة (الأحدث فقط)
          var tv = val(u);
          if (tv > c._target + 0.5) {
            c._target = tv;
            var now = Date.now();
            if (now - lastHit > 250) { lastHit = now; c.classList.remove("hit"); void c.offsetWidth; c.classList.add("hit"); }
          } else c._target = tv;

          // منبعث النار/الدخان
          var e = emitters[u.id] || (emitters[u.id] = { x: AVA_CX, y: y + AVA_CY_OFF, ty: y + AVA_CY_OFF });
          e.ty = y + AVA_CY_OFF; e.color = RC[i]; e.smoke = (rk === 2);
        });

        // إزالة من خرج من القائمة
        for (id in cards) if (!present[id]) {
          (function (cid, c) {
            c.style.opacity = "0";
            c.style.transform = "translate(64px," + (parseFloat((c.style.transform.match(/,\s*([\-\d.]+)px\)/) || [0, 0])[1]) || 0) + "px)";
            setTimeout(function () { if (c.parentNode) c.parentNode.removeChild(c); }, 520);
          })(id, cards[id]);
          delete cards[id]; delete emitters[id]; delete users[id];
        }
      }

      // ============ الجزيئات (نار + دخان + شرار) في كانفس واحد ============
      var fire = [], smoke = [], DPR = Math.min(2, window.devicePixelRatio || 1);
      function resizeCanvas() {
        cv.width = W * DPR; cv.height = H * DPR;
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      }
      resizeCanvas();

      function spawn(e) {
        // ذرّات نار تلتف حول الأفاتار وتصعد
        var n = e.smoke ? 1 : 4;
        for (var i = 0; i < n; i++) {
          var ang = Math.random() * Math.PI * 2, rad = 30 + Math.random() * 18;
          fire.push({
            x: e.x + Math.cos(ang) * rad, y: e.y + Math.sin(ang) * rad * 0.7 + 14,
            vx: Math.cos(ang) * 0.5 + (Math.random() - 0.5) * 0.6, vy: -(0.9 + Math.random() * 1.7),
            life: 0, max: 36 + Math.random() * 30, r: 3 + Math.random() * 4.6, c: e.color
          });
        }
        // شرار متطاير
        if (!e.smoke && Math.random() < 0.4) {
          var a = Math.random() * Math.PI * 2, sp = 1.4 + Math.random() * 2.4;
          fire.push({ x: e.x, y: e.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 0.8,
            life: 0, max: 28 + Math.random() * 20, r: 1.2 + Math.random() * 1.5, c: "#fff", spark: 1 });
        }
        // دخان (للمركز الفضّي)
        if (e.smoke && Math.random() < 0.95) {
          smoke.push({ x: e.x + (Math.random() - 0.5) * 66, y: e.y + (Math.random() - 0.5) * 34,
            vx: (Math.random() - 0.5) * 0.4, vy: -(0.4 + Math.random() * 0.7),
            life: 0, max: 64 + Math.random() * 46, r: 11 + Math.random() * 16 });
        }
      }

      function draw() {
        // تنعيم موضع المنبعث ليتبع البطاقة أثناء إعادة الترتيب
        var id;
        for (id in emitters) { var e = emitters[id]; e.y += (e.ty - e.y) * 0.16; spawn(e); }

        ctx.clearRect(0, 0, W, H);

        // هالة توهّج معتدلة خلف كل أفاتار
        ctx.globalCompositeOperation = "lighter";
        var tnow = Date.now();
        for (id in emitters) {
          var em = emitters[id], pu = 0.5 + 0.5 * Math.sin(tnow / 900 + em.y);
          var ar = 60, ga = ctx.createRadialGradient(em.x, em.y, 6, em.x, em.y, ar);
          ga.addColorStop(0, hexA(em.color, 0.16 + 0.07 * pu));
          ga.addColorStop(0.55, hexA(em.color, 0.06));
          ga.addColorStop(1, hexA(em.color, 0));
          ctx.fillStyle = ga; ctx.beginPath(); ctx.arc(em.x, em.y, ar, 0, 6.283); ctx.fill();
        }

        // الدخان (خلف)
        ctx.globalCompositeOperation = "source-over";
        for (var i = smoke.length - 1; i >= 0; i--) {
          var s = smoke[i]; s.life++; s.x += s.vx; s.y += s.vy; s.vy *= 0.995; s.r += 0.25;
          var k = s.life / s.max; if (k >= 1) { smoke.splice(i, 1); continue; }
          var a = Math.sin(k * Math.PI) * 0.16;
          var g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.r);
          g.addColorStop(0, "rgba(235,240,248," + a + ")");
          g.addColorStop(1, "rgba(235,240,248,0)");
          ctx.fillStyle = g; ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.283); ctx.fill();
        }

        // النار (إضاءة جمعية)
        ctx.globalCompositeOperation = "lighter";
        for (var j = fire.length - 1; j >= 0; j--) {
          var p = fire[j]; p.life++; p.x += p.vx; p.y += p.vy;
          if (!p.spark) p.vy -= 0.006; else { p.vy += 0.05; }
          var t = p.life / p.max; if (t >= 1) { fire.splice(j, 1); continue; }
          var al = (1 - t) * (p.spark ? 0.95 : 0.7), rr = p.r * (1 - t * 0.4);
          var gg = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, rr * 2.4);
          gg.addColorStop(0, "rgba(255,255,255," + al + ")");
          gg.addColorStop(0.4, hexA(p.c, al * 0.9));
          gg.addColorStop(1, hexA(p.c, 0));
          ctx.fillStyle = gg; ctx.beginPath(); ctx.arc(p.x, p.y, rr * 2.4, 0, 6.283); ctx.fill();
        }
        ctx.globalCompositeOperation = "source-over";

        if (dirty) { dirty = false; layout(); }
        // تنعيم عدّاد الأرقام
        for (id in cards) {
          var c = cards[id];
          if (Math.abs(c._target - c._val) > 0.5) {
            c._val += (c._target - c._val) * 0.16;
            if (Math.abs(c._target - c._val) < 1) c._val = c._target;
            c._cnt.textContent = fmt(c._val);
          }
        }
        requestAnimationFrame(draw);
      }

      function hexA(hex, a) {
        var h = hex.replace("#", "");
        if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
        var n = parseInt(h, 16);
        return "rgba(" + ((n >> 16) & 255) + "," + ((n >> 8) & 255) + "," + (n & 255) + "," + a + ")";
      }

      dirty = true;
      requestAnimationFrame(draw);
      return { handle: handle };
    }
  }

  if (P("demo") === "1") {
    // ← بيانات تجريبية: نادي onEvent({...}) بنفس شكل الرسايل اللي فوق كل 3 ثواني
    var coins = P("metric", "likes") === "coins";
    var names = ["مستخدم تجريبي 1", "Alex_Gaming🎮", "عبدالرحمن القحطاني", "S", "لاعب محترف اسمه طويل جداً للاختبار"];
    var seed = [12000, 9800, 7200, 5100, 4000];
    var demoUsers = names.map(function (nm, i) {
      return { id: "u" + (i + 1), name: nm, handle: "user" + (i + 1), avatar: "" };
    });
    function push(u, amt) {
      if (coins) onEvent({ type: "gift", user: u, gift: { id: 1, name: "Rose", image: "" }, count: 1, diamonds: amt });
      else onEvent({ type: "like", user: u, count: amt });
    }
    demoUsers.forEach(function (u, i) { push(u, seed[i]); });
    var extra = { id: "u6", name: "🔥 نجم صاعد", handle: "rising", avatar: "" }, extraIn = false;
    setInterval(function () {
      var hits = 1 + (Math.random() * 2 | 0), i;
      for (i = 0; i < hits; i++) {
        var u = demoUsers[Math.random() * demoUsers.length | 0];
        push(u, coins ? 200 + (Math.random() * 2200 | 0) : 300 + (Math.random() * 3200 | 0));
      }
      if (!extraIn && Math.random() < 0.28) { extraIn = true; push(extra, coins ? 6000 : 9000); }
      else if (extraIn && Math.random() < 0.2) { push(extra, coins ? 2000 : 3000); }
    }, 3000);
    return;
  }

  var feed = P("feed"), key = P("key");
  if (!feed || !key) return;
  var url = feed.replace(/\/+$/, "") + "/?key=" + encodeURIComponent(key), wait = 1000;
  (function connect() {
    var ws;
    try { ws = new WebSocket(url); } catch (e) { return setTimeout(connect, wait); }
    ws.onopen = function () { wait = 1000; };
    ws.onmessage = function (e) { var m; try { m = JSON.parse(e.data); } catch (x) { return; } onEvent(m); };
    ws.onclose = function () { setTimeout(connect, wait); wait = Math.min(wait * 2, 15000); };
    ws.onerror = function () { try { ws.close(); } catch (e) {} };
  })();
})();
</script></body></html>
