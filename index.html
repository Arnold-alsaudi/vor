<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<title>المتصدرون - Top Likes</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Lilita+One&family=Cairo:wght@800;900&display=swap">
<style>
  :root{--c:#8b5cf6}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;background:transparent;overflow:hidden}
  #stage{position:absolute;left:0;top:0;width:640px;height:620px;transform-origin:0 0;direction:ltr}

  /* ← الـ CSS بتاعك هنا */
  #fx{position:absolute;left:0;top:0;width:640px;height:620px;pointer-events:none;z-index:1}
  #board{position:absolute;left:0;top:0;width:640px;height:620px;z-index:2}

  #title{position:absolute;left:20px;top:2px;width:600px;text-align:center;
    font-family:'Lalezar',sans-serif;font-size:30px;letter-spacing:1px;color:#fff;
    text-shadow:0 0 16px var(--c),0 2px 4px rgba(0,0,0,.8);display:none}
  #title.on{display:block;animation:tin .7s ease both}
  @keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}

  .card{position:absolute;left:12px;top:0;width:616px;height:100px;
    transform:translate(70px,0);opacity:0;will-change:transform,opacity;
    transition:transform .66s cubic-bezier(.2,.85,.25,1),opacity .5s ease}

  /* لوحة الألوان المعدنية لكل مركز */
  .card[data-rank="1"]{--rc:#ffcf33;--b1:#8a5e05;--b2:#e0a10f;--b3:#ffe27a;--txt:#3a2600;--tsh:rgba(255,236,170,.6)}
  .card[data-rank="2"]{--rc:#eaf0f7;--b1:#5d6672;--b2:#98a2b0;--b3:#eef3f9;--txt:#141a24;--tsh:rgba(255,255,255,.7)}
  .card[data-rank="3"]{--rc:#ff5347;--b1:#7d0d0d;--b2:#d31f1f;--b3:#ff6a60;--txt:#fff;--tsh:rgba(255,120,110,.6)}
  .card[data-rank="4"]{--rc:#33a8ff;--b1:#083473;--b2:#1568d6;--b3:#5aa9f7;--txt:#fff;--tsh:rgba(120,190,255,.6)}
  .card[data-rank="5"]{--rc:#88ff2e;--b1:#186b12;--b2:#3aa724;--b3:#aef05e;--txt:#0e2607;--tsh:rgba(190,255,140,.6)}

  .bar{position:absolute;left:0;top:19px;width:452px;height:62px;border-radius:16px;
    background:linear-gradient(103deg,var(--b1),var(--b2) 52%,var(--b3));
    box-shadow:0 0 26px -3px var(--rc),0 8px 20px rgba(0,0,0,.5),
      inset 0 2px 0 rgba(255,255,255,.45),inset 0 -3px 8px rgba(0,0,0,.32),
      inset 0 0 0 1px rgba(255,255,255,.12);
    overflow:hidden}
  .bar::before{content:"";position:absolute;left:0;right:0;top:0;height:48%;
    background:linear-gradient(180deg,rgba(255,255,255,.38),rgba(255,255,255,0));
    border-radius:16px 16px 40% 40%/16px 16px 22px 22px;pointer-events:none}
  .bar::after{content:"";position:absolute;top:0;bottom:0;left:-45%;width:40%;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.6),transparent);
    transform:skewX(-18deg);opacity:0;pointer-events:none}
  .card.hit .bar::after{animation:shine .75s ease}
  @keyframes shine{0%{left:-45%;opacity:.9}100%{left:125%;opacity:0}}

  .stat{position:absolute;left:16px;top:0;height:62px;display:flex;align-items:center;gap:8px;z-index:2}
  .stat svg{width:27px;height:27px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.45));flex:0 0 auto}
  .cnt{font-family:'Lilita One',cursive;font-size:30px;line-height:1;color:var(--txt);
    text-shadow:0 1px 1px rgba(0,0,0,.25),0 0 10px var(--tsh);letter-spacing:.5px}

  .nm{position:absolute;top:0;left:128px;right:92px;height:62px;display:flex;align-items:center;
    justify-content:flex-end;overflow:hidden;z-index:2}
  .nm span{font-family:'Lalezar',sans-serif;font-size:28px;line-height:1.05;color:var(--txt);
    white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,.3);transform-origin:right center}

  /* الأفاتار + هالة الطيف الدوّارة */
  .ava{position:absolute;left:380px;top:4px;width:96px;height:96px;z-index:3}
  .halo{position:absolute;inset:-14px;border-radius:50%;opacity:.85;filter:blur(2.5px);
    background:conic-gradient(from 0deg,transparent 0deg,var(--rc) 60deg,transparent 130deg,
      rgba(255,255,255,.85) 200deg,transparent 250deg,var(--rc) 320deg,transparent 360deg);
    -webkit-mask:radial-gradient(circle,transparent 45px,#000 47px,#000 59px,transparent 61px);
    mask:radial-gradient(circle,transparent 45px,#000 47px,#000 59px,transparent 61px);
    animation:spin 7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .pic{position:absolute;inset:0;border-radius:50%;overflow:hidden;background:#0b0b0f;
    box-shadow:inset 0 0 20px rgba(0,0,0,.75),0 0 0 3px rgba(0,0,0,.45),0 6px 16px rgba(0,0,0,.5)}
  .pic img{width:100%;height:100%;object-fit:cover;display:block}
  .pic .ini{width:100%;height:100%;display:flex;align-items:center;justify-content:center;
    font-family:'Lilita One',cursive;font-size:44px;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.6)}

  /* ميدالية الرقم */
  .rank{position:absolute;left:486px;top:20px;width:122px;height:60px;border-radius:16px;z-index:3;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(160deg,var(--b3),var(--b2) 55%,var(--b1));
    box-shadow:0 0 22px -2px var(--rc),inset 0 2px 0 rgba(255,255,255,.5),
      inset 0 -4px 10px rgba(0,0,0,.4),0 6px 14px rgba(0,0,0,.45),inset 0 0 0 1px rgba(255,255,255,.15)}
  .rank b{font-family:'Lilita One',cursive;font-size:46px;line-height:1;color:var(--txt);
    text-shadow:0 2px 3px rgba(0,0,0,.4),0 0 14px var(--tsh);-webkit-text-stroke:1px rgba(0,0,0,.18)}
  .rank .crown{position:absolute;top:-14px;left:50%;transform:translateX(-50%);
    font-size:22px;filter:drop-shadow(0 0 6px var(--rc));display:none}
  .card[data-rank="1"] .rank .crown{display:block}
</style></head>
<body>
<div id="stage">
  <!-- ← عناصر التركيبة هنا -->
  <canvas id="fx" width="640" height="620"></canvas>
  <div id="title"></div>
  <div id="board"></div>
</div>
<script>
(function () {
  "use strict";
  var CFG = window.__T || {}, q = new URLSearchParams(location.search);
  function P(k, d) { return CFG[k] != null ? String(CFG[k]) : (q.has(k) ? q.get(k) : d); }
  var $ = function (id) { return document.getElementById(id); };

  var col = P("color", "");
  if (/^#[0-9a-f]{6}$/i.test(col)) document.documentElement.style.setProperty("--c", col);

  var W = 1000, H = 300, stage = $("stage");   // ← نفس مقاس #stage
  W = 640; H = 620;
  function fit() {
    var s = Math.min(innerWidth / W, innerHeight / H);
    stage.style.transform = "translate(" + (innerWidth - W * s) / 2 + "px," + (innerHeight - H * s) / 2 + "px) scale(" + s + ")";
  }
  addEventListener("resize", fit); fit();

  // ← بيتنادى مع كل رسالة من السيرفر (أو من وضع المعاينة). اكتب هنا اللي بيحصل.
  function onEvent(m) {
    var A = stage.__app || (stage.__app = createApp());
    A.handle(m);

    // ============ منطق التركيبة (يُنشأ مرّة واحدة) ============
    function createApp() {
      var board = $("board"), cv = $("fx"), ctx = cv.getContext("2d");

      var METRIC = (P("metric", "likes") === "coins") ? "coins" : "likes";
      var MAX = Math.max(3, Math.min(5, parseInt(P("max", "5"), 10) || 5));
      var DEMO = P("demo") === "1";
      var titleTxt = P("title", "");
      if (titleTxt) { var t = $("title"); t.textContent = titleTxt; t.className = "on"; }
      var TOP_PAD = titleTxt ? 42 : 26, STRIDE = 114, AVA_CX = 428, AVA_CY_OFF = 52;

      var RC = ["#ffcf33", "#eef2f8", "#ff4d40", "#33a8ff", "#88ff2e"];
      var HEART = '<svg viewBox="0 0 24 24"><path fill="#ff2d55" d="M12 21s-7.5-4.8-10-9.3C.3 8.4 2 4.7 5.5 4.7c2 0 3.4 1.1 4.5 2.6 1.1-1.5 2.5-2.6 4.5-2.6C18 4.7 19.7 8.4 22 11.7 19.5 16.2 12 21 12 21z"/></svg>';
      var COIN = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#ffcf33"/><circle cx="12" cy="12" r="7.4" fill="none" stroke="#a97a00" stroke-width="1.6"/><path fill="#a97a00" d="M12 6.4l1.7 3.4 3.7.5-2.7 2.6.7 3.7L12 14.9 8.9 16.5l.7-3.7L6.9 10.2l3.7-.5z"/></svg>';
      var ICON = METRIC === "coins" ? COIN : HEART;

      var users = {}, cards = {}, emitters = {}, dirty = false, lastHit = 0;
      function val(u) { return METRIC === "coins" ? u.coins : u.likes; }
      function fmt(n) { n = Math.round(n);
        if (n >= 1e6) return (n / 1e6).toFixed(1) + "M";
        if (n >= 1e3) return (n / 1e3).toFixed(1) + "K";
        return "" + n; }
      function firstChar(s) { s = (s || "").trim(); return s ? Array.from(s)[0] : "?"; }
      function hue(id) { var h = 0, i; id = "" + id; for (i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) % 360; return h; }
      function hexA(hex, a) { var h = hex.replace("#", "");
        if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
        var n = parseInt(h, 16); return "rgba(" + ((n >> 16) & 255) + "," + ((n >> 8) & 255) + "," + (n & 255) + "," + a + ")"; }

      function upsert(user, field, amount) {
        if (!user || user.id == null) return;
        var id = "" + user.id, u = users[id];
        if (!u) u = users[id] = { id: id, likes: 0, coins: 0 };
        if (user.name != null) u.name = user.name;
        if (user.handle != null) u.handle = user.handle;
        if (user.avatar != null) u.avatar = user.avatar;
        u[field] += (amount > 0 ? amount : 0);
      }
      function handle(m) {
        if (!m || !m.type) return;
        if (m.type === "like") upsert(m.user, "likes", +m.count || 0);
        else if (m.type === "gift") upsert(m.user, "coins", +m.diamonds || 0);
        else if (m.type === "top" && m.user) upsert(m.user, "coins", 0);
        else return;
        dirty = true;
      }

      function fitName(sp) {
        var box = sp.parentNode, avail = box.clientWidth - 2, size = 28;
        sp.style.transform = ""; sp.style.fontSize = size + "px";
        while (sp.scrollWidth > avail && size > 13) { size -= 1; sp.style.fontSize = size + "px"; }
        if (sp.scrollWidth > avail) sp.style.transform = "scaleX(" + Math.max(0.72, avail / sp.scrollWidth) + ")";
      }
      function setAvatar(el, u) {
        var box = el._pic;
        var useImg = !DEMO && u.avatar && /^https?:\/\/[^\/]*tiktokcdn\.com\//i.test(u.avatar);
        if (useImg) {
          if (el._imgSrc === u.avatar) return;
          el._imgSrc = u.avatar; box.innerHTML = "";
          var img = document.createElement("img");
          img.onerror = function () { el._imgSrc = null; showIni(); };
          img.src = u.avatar; box.appendChild(img);
        } else { el._imgSrc = null; showIni(); }
        function showIni() {
          box.innerHTML = "";
          var d = document.createElement("div");
          d.className = "ini"; d.textContent = firstChar(u.name || u.handle || "?");
          var rc = (getComputedStyle(el).getPropertyValue("--rc") || "").trim() || "hsl(" + hue(u.id) + ",65%,45%)";
          d.style.background = "radial-gradient(circle at 34% 28%," + rc + ",rgba(0,0,0,.6))";
          box.appendChild(d);
        }
      }
      function makeCard() {
        var c = document.createElement("div");
        c.className = "card";
        c.innerHTML =
          '<div class="bar"><div class="stat">' + ICON + '<span class="cnt">0</span></div>' +
          '<div class="nm"><span></span></div></div>' +
          '<div class="ava"><div class="halo"></div><div class="pic"></div></div>' +
          '<div class="rank"><span class="crown">👑</span><b></b></div>';
        c._cnt = c.querySelector(".cnt"); c._nm = c.querySelector(".nm span");
        c._pic = c.querySelector(".pic"); c._pic._card = c; c._rank = c.querySelector(".rank b");
        c._val = 0; c._target = 0; c._name = "";
        board.appendChild(c); return c;
      }

      function layout() {
        var list = [], id;
        for (id in users) if (val(users[id]) > 0) list.push(users[id]);
        list.sort(function (a, b) { return val(b) - val(a) || (a.id < b.id ? -1 : 1); });
        list = list.slice(0, MAX);
        var present = {};
        list.forEach(function (u, i) {
          present[u.id] = 1;
          var rk = i + 1, y = TOP_PAD + i * STRIDE, c = cards[u.id];
          if (!c) {
            c = cards[u.id] = makeCard();
            c.setAttribute("data-rank", rk);
            c.style.transform = "translate(70px," + y + "px)";
            c._val = val(u); c._cnt.textContent = fmt(c._val);
            requestAnimationFrame(function () { requestAnimationFrame(function () {
              c.style.opacity = "1"; c.style.transform = "translate(0," + y + "px)"; }); });
          } else {
            c.setAttribute("data-rank", rk);
            c.style.opacity = "1"; c.style.transform = "translate(0," + y + "px)";
          }
          if (c._name !== (u.name || u.handle || "")) {
            c._name = u.name || u.handle || ""; c._nm.textContent = c._name; fitName(c._nm);
          }
          c._rank.textContent = rk;
          setAvatar(c, u);
          var tv = val(u);
          if (tv > c._target + 0.5) {
            c._target = tv; var now = Date.now();
            if (now - lastHit > 220) { lastHit = now; c.classList.remove("hit"); void c.offsetWidth; c.classList.add("hit"); }
          } else c._target = tv;
          var e = emitters[u.id] || (emitters[u.id] = mkEmitter(y + AVA_CY_OFF));
          e.ty = y + AVA_CY_OFF; e.color = RC[i]; e.rank = rk;
        });
        for (id in cards) if (!present[id]) {
          (function (c) {
            var m = c.style.transform.match(/,\s*([\-\d.]+)px\)/);
            c.style.opacity = "0"; c.style.transform = "translate(70px," + (m ? m[1] : 0) + "px)";
            setTimeout(function () { if (c.parentNode) c.parentNode.removeChild(c); }, 540);
          })(cards[id]);
          delete cards[id]; delete emitters[id]; delete users[id];
        }
      }

      // ============ محرك التأثيرات (كانفس واحد): كرات لهب + شرار + دخان + برق + طيف ============
      var fire = [], sparks = [], smoke = [], DPR = Math.min(2, window.devicePixelRatio || 1);
      cv.width = W * DPR; cv.height = H * DPR; ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

      function mkEmitter(y) {
        var orbs = [], N = 13, i;
        for (i = 0; i < N; i++) orbs.push({ a: i / N * 6.283, ph: Math.random() * 6.283, sz: 0.85 + Math.random() * 0.55, rb: 60 + Math.random() * 12 });
        return { x: AVA_CX, y: y, ty: y, color: "#fff", rank: 1, orbs: orbs, spin: Math.random() * 6.283, lt: 20 + Math.random() * 50, bolts: [] };
      }

      function makeBolt(cx, cy, R, color) {
        var a0 = Math.random() * 6.283, a1 = a0 + (0.9 + Math.random() * 1.3) * (Math.random() < .5 ? 1 : -1);
        var pts = [[cx + Math.cos(a0) * R, cy + Math.sin(a0) * R], [cx + Math.cos(a1) * R, cy + Math.sin(a1) * R]], s, i, np, a, b, mx, my, d, off, nx, ny;
        for (s = 0; s < 4; s++) {
          np = [];
          for (i = 0; i < pts.length - 1; i++) {
            a = pts[i]; b = pts[i + 1]; mx = (a[0] + b[0]) / 2; my = (a[1] + b[1]) / 2;
            d = Math.hypot(b[0] - a[0], b[1] - a[1]) || 1; off = (Math.random() - .5) * d * 0.5;
            nx = -(b[1] - a[1]) / d; ny = (b[0] - a[0]) / d;
            np.push(a); np.push([mx + nx * off, my + ny * off]);
          }
          np.push(pts[pts.length - 1]); pts = np;
        }
        return { pts: pts, life: 0, max: 7 + Math.random() * 6, color: color };
      }

      function stepEmitter(e) {
        e.y += (e.ty - e.y) * 0.16;
        var cx = e.x, cy = e.y, i, o, ang, fl, rr, smk = (e.rank === 2);
        // كرات اللهب (إكليل حول الأفاتار)
        e.spin += smk ? 0.004 : 0.008;
        var now = Date.now();
        for (i = 0; i < e.orbs.length; i++) {
          o = e.orbs[i]; ang = o.a + e.spin;
          fl = 0.6 + 0.4 * Math.sin(now * 0.007 + o.ph);
          rr = o.rb + 6 * Math.sin(now * 0.004 + o.ph * 1.7);
          fire.push({ x: cx + Math.cos(ang) * rr, y: cy + Math.sin(ang) * rr * 0.94, s: (smk ? 13 : 19) * o.sz * fl, c: e.color, smk: smk });
        }
        // شرار متصاعد
        if (!smk && Math.random() < 0.75) sparks.push({ x: cx + (Math.random() - .5) * 96, y: cy + 26, vx: (Math.random() - .5) * 0.9, vy: -(1.1 + Math.random() * 2), life: 0, max: 32 + Math.random() * 24, c: e.color });
        if (!smk && Math.random() < 0.3) { var aa = Math.random() * 6.283, sp = 1.6 + Math.random() * 2.4; sparks.push({ x: cx + Math.cos(aa) * 60, y: cy + Math.sin(aa) * 56, vx: Math.cos(aa) * sp, vy: Math.sin(aa) * sp - 0.7, life: 0, max: 26 + Math.random() * 18, c: "#fff" }); }
        // دخان / غيوم
        if (Math.random() < (smk ? 1 : 0.55)) smoke.push({ x: cx + (Math.random() - .5) * 100, y: cy + 10 + (Math.random() - .5) * 40, vx: (Math.random() - .5) * 0.45, vy: -(0.4 + Math.random() * 0.7), life: 0, max: 66 + Math.random() * 50, r: 16 + Math.random() * 20, c: smk ? "236,241,248" : null, cc: e.color });
        // البرق / الرعد
        if (--e.lt <= 0) {
          var cnt = (e.rank === 4) ? 2 : 1;
          for (i = 0; i < cnt; i++) e.bolts.push(makeBolt(cx, cy, 62, e.color));
          e.lt = (e.rank === 4 ? 20 : 45) + Math.random() * (e.rank === 4 ? 30 : 70);
        }
      }

      function draw() {
        var id, e;
        for (id in emitters) stepEmitter(emitters[id]);
        ctx.clearRect(0, 0, W, H);

        // 1) هالة توهّج خفيفة
        ctx.globalCompositeOperation = "lighter";
        var tnow = Date.now();
        for (id in emitters) { e = emitters[id];
          var pu = 0.5 + 0.5 * Math.sin(tnow / 900 + e.y), ar = 66,
            ga = ctx.createRadialGradient(e.x, e.y, 8, e.x, e.y, ar);
          ga.addColorStop(0, hexA(e.color, 0.15 + 0.06 * pu));
          ga.addColorStop(0.55, hexA(e.color, 0.05)); ga.addColorStop(1, hexA(e.color, 0));
          ctx.fillStyle = ga; ctx.beginPath(); ctx.arc(e.x, e.y, ar, 0, 6.283); ctx.fill();
        }

        // 2) الدخان (خلف - source-over)
        ctx.globalCompositeOperation = "source-over";
        for (var si = smoke.length - 1; si >= 0; si--) {
          var s = smoke[si]; s.life++; s.x += s.vx; s.y += s.vy; s.vy *= 0.995; s.r += 0.3;
          var k = s.life / s.max; if (k >= 1) { smoke.splice(si, 1); continue; }
          var a = Math.sin(k * Math.PI) * (s.c ? 0.16 : 0.09);
          var col2 = s.c || (hexA(s.cc, 1).slice(5, -4));
          var g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.r);
          g.addColorStop(0, "rgba(" + col2 + "," + a + ")"); g.addColorStop(1, "rgba(" + col2 + ",0)");
          ctx.fillStyle = g; ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.283); ctx.fill();
        }

        // 3) كرات اللهب (إضاءة جمعية)
        ctx.globalCompositeOperation = "lighter";
        for (var fi = fire.length - 1; fi >= 0; fi--) {
          var p = fire[fi];
          var g2 = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.s);
          if (p.smk) { g2.addColorStop(0, "rgba(240,244,250,.5)"); g2.addColorStop(1, "rgba(240,244,250,0)"); }
          else { g2.addColorStop(0, "rgba(255,255,255,.95)"); g2.addColorStop(0.35, hexA(p.c, 0.9)); g2.addColorStop(1, hexA(p.c, 0)); }
          ctx.fillStyle = g2; ctx.beginPath(); ctx.arc(p.x, p.y, p.s, 0, 6.283); ctx.fill();
        }
        fire.length = 0;

        // 4) الشرار
        for (var pi = sparks.length - 1; pi >= 0; pi--) {
          var q2 = sparks[pi]; q2.life++; q2.x += q2.vx; q2.y += q2.vy; q2.vy += 0.02;
          var t = q2.life / q2.max; if (t >= 1) { sparks.splice(pi, 1); continue; }
          var al = (1 - t) * 0.9, rr2 = 2.4 * (1 - t * 0.4);
          var g3 = ctx.createRadialGradient(q2.x, q2.y, 0, q2.x, q2.y, rr2 * 2.4);
          g3.addColorStop(0, "rgba(255,255,255," + al + ")"); g3.addColorStop(0.4, hexA(q2.c, al * 0.9)); g3.addColorStop(1, hexA(q2.c, 0));
          ctx.fillStyle = g3; ctx.beginPath(); ctx.arc(q2.x, q2.y, rr2 * 2.4, 0, 6.283); ctx.fill();
        }

        // 5) البرق
        ctx.lineCap = "round"; ctx.lineJoin = "round";
        for (id in emitters) { e = emitters[id];
          for (var bi = e.bolts.length - 1; bi >= 0; bi--) {
            var bo = e.bolts[bi]; bo.life++;
            var bt = bo.life / bo.max; if (bt >= 1) { e.bolts.splice(bi, 1); continue; }
            var ba = Math.sin(bt * Math.PI);
            ctx.beginPath(); ctx.moveTo(bo.pts[0][0], bo.pts[0][1]);
            for (var pp = 1; pp < bo.pts.length; pp++) ctx.lineTo(bo.pts[pp][0], bo.pts[pp][1]);
            ctx.strokeStyle = hexA(bo.color, ba * 0.5); ctx.lineWidth = 6; ctx.stroke();
            ctx.strokeStyle = "rgba(255,255,255," + (ba * 0.95) + ")"; ctx.lineWidth = 1.6; ctx.stroke();
          }
        }
        ctx.globalCompositeOperation = "source-over";

        if (dirty) { dirty = false; layout(); }
        for (id in cards) { var c = cards[id];
          if (Math.abs(c._target - c._val) > 0.5) {
            c._val += (c._target - c._val) * 0.16;
            if (Math.abs(c._target - c._val) < 1) c._val = c._target;
            c._cnt.textContent = fmt(c._val);
          }
        }
        requestAnimationFrame(draw);
      }

      dirty = true; requestAnimationFrame(draw);
      return { handle: handle };
    }
  }

  if (P("demo") === "1") {
    // ← بيانات تجريبية: نادي onEvent({...}) بنفس شكل الرسايل اللي فوق كل 3 ثواني
    var coins = P("metric", "likes") === "coins";
    var names = ["مستخدم تجريبي 1", "Alex_Gaming🎮", "عبدالرحمن القحطاني", "S", "لاعب محترف اسمه طويل جداً للاختبار"];
    var seed = [12000, 9800, 7200, 5100, 4000];
    var demoUsers = names.map(function (nm, i) { return { id: "u" + (i + 1), name: nm, handle: "user" + (i + 1), avatar: "" }; });
    function push(u, amt) {
      if (coins) onEvent({ type: "gift", user: u, gift: { id: 1, name: "Rose", image: "" }, count: 1, diamonds: amt });
      else onEvent({ type: "like", user: u, count: amt });
    }
    demoUsers.forEach(function (u, i) { push(u, seed[i]); });
    var extra = { id: "u6", name: "🔥 نجم صاعد", handle: "rising", avatar: "" }, extraIn = false;
    setInterval(function () {
      var hits = 1 + (Math.random() * 2 | 0), i;
      for (i = 0; i < hits; i++) { var u = demoUsers[Math.random() * demoUsers.length | 0]; push(u, coins ? 200 + (Math.random() * 2200 | 0) : 300 + (Math.random() * 3200 | 0)); }
      if (!extraIn && Math.random() < 0.28) { extraIn = true; push(extra, coins ? 6000 : 9000); }
      else if (extraIn && Math.random() < 0.2) { push(extra, coins ? 2000 : 3000); }
    }, 3000);
    return;
  }

  var feed = P("feed"), key = P("key");
  if (!feed || !key) return;
  var url = feed.replace(/\/+$/, "") + "/?key=" + encodeURIComponent(key), wait = 1000;
  (function connect() {
    var ws;
    try { ws = new WebSocket(url); } catch (e) { return setTimeout(connect, wait); }
    ws.onopen = function () { wait = 1000; };
    ws.onmessage = function (e) { var m; try { m = JSON.parse(e.data); } catch (x) { return; } onEvent(m); };
    ws.onclose = function () { setTimeout(connect, wait); wait = Math.min(wait * 2, 15000); };
    ws.onerror = function () { try { ws.close(); } catch (e) {} };
  })();
})();
</script></body></html>
